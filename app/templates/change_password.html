{% extends "base.html" %}
{% block title %}修改密码 - 付款进度管理系统{% endblock %}
{% block page_title %}修改密码{% endblock %}
{% block content %}

<div class="card" style="max-width:560px;">
  <div class="card-title">
    修改密码
    {% if must_change %}<span class="badge badge-orange">首次登录/密码已被重置，必须先修改</span>{% endif %}
  </div>

  <div class="flash warning" style="margin-bottom:12px;">
    密码要求：至少 8 位；不能与用户名相同；不能使用系统默认口令（如 admin123 / 123456）。
    修改成功后，所有旧会话（含本机其它标签页）将失效，需要重新登录。
  </div>

  <form method="post" action="{{ url_for('main.change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <label class="field-label">当前密码 *</label>
      <input type="password" name="current_password" autocomplete="current-password" style="width:100%;" required>
    </div>
    <div class="form-row">
      <label class="field-label">新密码 *</label>
      <input type="password" name="new_password" autocomplete="new-password" style="width:100%;" required minlength="8">
    </div>
    <div class="form-row">
      <label class="field-label">确认新密码 *</label>
      <input type="password" name="confirm_password" autocomplete="new-password" style="width:100%;" required minlength="8">
    </div>
    <div class="flex mt-16" style="gap:12px;">
      <button type="submit" class="btn btn-primary btn-lg">保存新密码</button>
      <a href="{{ url_for('main.projects') }}" class="btn btn-ghost">取消</a>
    </div>
  </form>
</div>

{% endblock %}
